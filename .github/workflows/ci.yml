name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # Reads the version from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Runs even when linting fails, so one push surfaces every problem.
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck

      # Generating needs no database: any new file means schema.ts changed
      # without a committed migration.
      - name: Migrations match the schema
        if: ${{ !cancelled() }}
        run: |
          pnpm exec drizzle-kit generate
          if [ -n "$(git status --porcelain -- src/shared/lib/drizzle/migrations)" ]; then
            echo "::error::schema.ts has changes without a migration. Run 'pnpm exec drizzle-kit generate' and commit src/shared/lib/drizzle/migrations/."
            git status --porcelain -- src/shared/lib/drizzle/migrations
            exit 1
          fi
